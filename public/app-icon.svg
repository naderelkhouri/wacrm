<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="#7c3aed" stroke-width="4" filter="url(#shadow)"/>

  <!-- Chat Bubble Background -->
  <g filter="url(#shadow)">
    <!-- Main bubble body -->
    <rect x="96" y="106" width="320" height="250" rx="60" fill="url(#waGrad)"/>
    <!-- Tail -->
    <path d="M 120 340 L 76 405 L 180 356 Z" fill="url(#waGrad)"/>
  </g>

  <!-- Inner contrast container -->
  <rect x="126" y="136" width="260" height="190" rx="40" fill="#14532d" opacity="0.9"/>

  <!-- Large Central AI Sparkle -->
  <path d="M 256 165 Q 256 231 322 231 Q 256 231 256 297 Q 256 231 190 231 Q 256 231 256 165 Z" fill="url(#sparkleGrad)" filter="url(#glow)"/>
  <path d="M 256 195 Q 256 231 292 231 Q 256 231 256 267 Q 256 231 220 231 Q 256 231 256 195 Z" fill="#7c3aed"/>

  <!-- Small top-right Sparkle -->
  <path d="M 345 150 Q 345 170 365 170 Q 345 170 345 190 Q 345 170 325 170 Q 345 170 345 150 Z" fill="#facc15"/>

  <!-- Small bottom-left Sparkle -->
  <path d="M 165 275 Q 165 290 180 290 Q 165 290 165 305 Q 165 290 150 290 Q 165 290 165 275 Z" fill="#facc15"/>

  <!-- Bottom Badge: WA CRM + THE AGENCY -->
  <rect x="156" y="415" width="200" height="52" rx="26" fill="url(#purpleGrad)" stroke="#ffffff" stroke-width="2"/>
  <text x="256" y="448" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">WA CRM</text>
</svg>
