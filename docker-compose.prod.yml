version: "3.9"

services:
  app:
    image: wacrm:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-https://api-db.admx.tech}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://wcloudapi.dev}"
        NEXT_PUBLIC_APP_LOCALE: "${NEXT_PUBLIC_APP_LOCALE:-pt-BR}"
        NEXT_PUBLIC_DJANGO_API_URL: "${NEXT_PUBLIC_DJANGO_API_URL:-https://api-crm.admx.tech}"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://api-db.admx.tech}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_DJANGO_API_URL=${NEXT_PUBLIC_DJANGO_API_URL:-https://api-crm.admx.tech}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY obrigatoria}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY obrigatoria}
      - META_APP_SECRET=${META_APP_SECRET:?META_APP_SECRET obrigatoria}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://wcloudapi.dev}
      - ALLOWED_INVITE_HOSTS=${ALLOWED_INVITE_HOSTS:-wcloudapi.dev,www.wcloudapi.dev,wacrm.admx.tech}
      - AUTOMATION_CRON_SECRET=${AUTOMATION_CRON_SECRET:?AUTOMATION_CRON_SECRET obrigatoria}
      - PAGSEGURO_WEBHOOK_SECRET=${PAGSEGURO_WEBHOOK_SECRET:-}
      - NEXT_PUBLIC_APP_LOCALE=${NEXT_PUBLIC_APP_LOCALE:-pt-BR}
      - PORT=3000
    networks:
      - network_core_stack
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == core-manager
      restart_policy:
        condition: on-failure

networks:
  network_core_stack:
    external: true
